<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section</title>
  <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    .hero {
      @apply flex flex-col justify-center
             px-6 py-16 md:px-12 md:py-24;
      overflow-wrap: anywhere;
    }

    .hero-content {
      @apply w-full max-w-6xl mx-auto;
      min-width: 0;
    }

    .hero h1 {
      @apply max-w-4xl text-4xl md:text-6xl
             font-bold leading-tight tracking-tight;
    }

    .hero h2 {
      @apply max-w-3xl mt-6 md:mt-8
             text-lg md:text-2xl leading-relaxed;
    }

    .hero-light {
      @apply bg-slate-50;
    }

    .hero-light h1 {
      @apply text-slate-900;
    }

    .hero-light h2 {
      @apply text-slate-700;
    }

    .hero-dark {
      @apply bg-slate-900;
    }

    .hero-dark h1 {
      @apply text-slate-50;
    }

    .hero-dark h2 {
      @apply text-slate-300;
    }

    .hero-centre {
      @apply text-center;
    }

    .hero-centre h1,
    .hero-centre h2 {
      @apply mx-auto;
    }

    .hero-min-height {
      @apply min-h-[480px] md:min-h-[85vh];
    }

    /* A hidden subheading must occupy no space. */
    .hero h2[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <header class="hero hero-dark hero-centre hero-min-height">
    <div class="hero-content">
      <h1>Hello Mr. Freeman</h1>
        <h2>Rise and Shine Mr Freeman, Rise and shine</h2>
    </div>
  </header>
</body>
</html>
